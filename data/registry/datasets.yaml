# Dataset register (ADR-008, ADR-009).
#
# One row for every dataset the project uses to test, calibrate or train, whoever made it. A dataset that
# is not here is not used. The documents themselves are not in the repository, with one exception: the
# fictional fixture below. Personal data never enters the repository (ADR-008).
#
# A row says where the data came from, under what terms it may be used, whether it contains personal
# data and, if it does, where the consent records are. `verified: false` means the licence or the consent
# has not yet been checked against its source; an unverified row cannot be used for a release (ADR-009).
schema: wanjiru.registry.datasets/0

datasets:
  synthetic-v0:
    title: Synthetic documents, version 0
    kind: evaluation fixture
    path: eval/fixtures/synthetic-v0
    origin: generated by tools/oracles/make_eval_vectors.py from fixed seeds
    documents: 300
    composition: 120 invoices, 100 receipts and 80 identity documents, each with the output of a simulated engine and a simulated baseline
    licence: Apache-2.0
    personal_data: none
    personal_data_note: every value is random; identity documents name the fictional state UTO, and IBANs use country prefixes from the ISO 3166 private-use range, so none can be a real account
    consent: not applicable
    verified: true
    status: in use
    use: tests of the evaluation harness only. It says nothing about how well any engine reads real paper.
    datasheet: eval/fixtures/synthetic-v0/README.md
  golden-v0:
    title: Golden set, version 0
    kind: evaluation set
    path: eval/golden
    origin: to be collected by the owner, with consent, from real invoices, receipts and identity documents
    documents: planned, about 360 per document class (wanjiru eval plan)
    composition: not yet collected
    licence: to be set by the owner before collection; the documents stay private
    personal_data: yes, by nature
    personal_data_note: the repository holds manifests only (hashes, classes, consent references), never the documents
    consent: required for every document, recorded per row of the manifest
    verified: false
    status: planned
    use: the quality contracts of eval/contracts are proven or refused on this set, and on nothing else
    datasheet: data/datasheets/golden-v0.md
