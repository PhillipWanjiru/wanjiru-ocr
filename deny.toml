# cargo-deny policy (ADR-007). There is one allow-list, this one: `cargo xtask licences` reads it, so that
# the check also runs where cargo-deny is not installed. data/registry/licences.yaml says why each licence
# is allowed or refused and must list exactly the allowed and review licences below; a test of
# wanjiru-cli compares the two.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences only. MPL-2.0 is file-level copyleft: allowed after review (record it in
# data/registry/licences.yaml). GPL, AGPL and LGPL are denied in the engine, by omission from this list.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
